<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#111827">
    <title>ورود | مدیریت تولید</title>
    <style>
        * {
            box-sizing: border-box
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Tahoma,Arial,sans-serif;
            background: #f3f4f6;
            color: #111827
        }

        body {
            display: grid;
            place-items: center;
            padding: 18px
        }

        .wrap {
            width: min(420px,100%)
        }

        .brand {
            text-align: center;
            margin-bottom: 18px
        }

            .brand h1 {
                font-size: 24px;
                margin: 0 0 6px
            }

            .brand p {
                margin: 0;
                color: #6b7280;
                font-size: 12px
            }

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 45px rgba(17,24,39,.09)
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px
        }

        .field {
            margin-bottom: 14px
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            font: inherit
        }

            input:focus {
                outline: none;
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37,99,235,.1)
            }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 11px;
            background: #111827;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer
        }

        .error {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 11px;
            padding: 10px;
            font-size: 12px;
            margin-bottom: 12px
        }

        .demo {
            margin-top: 14px;
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 11px;
            padding: 10px;
            font-size: 11px;
            color: #6b7280
        }

        .security {
            margin-top: 14px;
            text-align: center;
            color: #9ca3af;
            font-size: 10px
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand"><h1>مدیریت تولید و انبار</h1><p>ورود امن به سامانه</p></div>
        <div class="card">
            <div id="error" class="error"></div>
            <form id="loginForm" autocomplete="on">
                <div class="field"><label for="username">نام کاربری</label><input id="username" name="username" autocomplete="username" required autofocus></div>
                <div class="field"><label for="password">رمز عبور</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
                <button id="submit" type="submit">ورود به سامانه</button>
            </form>
            <div class="demo">حساب نمونه اولیه: <b>admin</b> / <b>Admin@12345</b><br>پس از استقرار واقعی، رمز نمونه را فوراً تغییر دهید.</div>
            <div class="security">احراز هویت و کنترل نقش‌ها در Cloudflare Worker انجام می‌شود؛ صرفاً مخفی‌کردن فرم در مرورگر معیار امنیت نیست.</div>
        </div>
    </div>
    <script>
        const form = document.querySelector("#loginForm"), err = document.querySelector("#error"), btn = document.querySelector("#submit");
        form.addEventListener("submit", async e => {
            e.preventDefault(); err.style.display = "none"; btn.disabled = true; btn.textContent = "در حال بررسی...";
            try {
                const body = { username: form.username.value.trim(), password: form.password.value };
                const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify(body) });
                const d = await r.json();
                if (!r.ok) throw new Error(d.error || "ورود ناموفق بود");
                location.href = "/";
            } catch (ex) { err.textContent = ex.message; err.style.display = "block" } finally { btn.disabled = false; btn.textContent = "ورود به سامانه" }
        });
    </script>
</body>
</html>
