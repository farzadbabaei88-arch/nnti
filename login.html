<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ورود | نینیتو</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;color:#18212b}
body{display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(440px,100%);background:#fff;border:1px solid #dfe5ea;border-radius:24px;box-shadow:0 20px 60px #17202b18;padding:30px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:54px;height:54px;border-radius:16px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0 0;color:#6d7782;font-size:13px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;height:48px;border:1px solid #cfd7de;border-radius:13px;padding:0 14px;font-size:16px;outline:none;background:#fff}input:focus{border-color:#111;box-shadow:0 0 0 3px #11110f0c}
button{width:100%;height:48px;border:0;border-radius:13px;background:#111;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:20px}button:disabled{opacity:.55;cursor:not-allowed}
.msg{display:none;margin-top:14px;border-radius:12px;padding:11px 13px;font-size:13px;background:#fff0f0;color:#9d2222;border:1px solid #ffd0d0}.hint{margin-top:20px;text-align:center;font-size:12px;color:#7c8791;line-height:1.8}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">ن</div><div><h1>نینیتو</h1><p>مدیریت تولید و موجودی مواد اولیه</p></div></div>
  <form id="loginForm" autocomplete="on">
    <label for="username">نام کاربری</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">رمز عبور</label>
    <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
    <button id="loginBtn" type="submit">ورود به سیستم</button>
    <div id="msg" class="msg"></div>
  </form>
  <div class="hint">دسترسی شما پس از ورود بر اساس نقش کاربری کنترل می‌شود.</div>
</main>
<script>
const form=document.getElementById('loginForm'),btn=document.getElementById('loginBtn'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{
 e.preventDefault();msg.style.display='none';btn.disabled=true;btn.textContent='در حال بررسی...';
 try{
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});
  const d=await r.json();
  if(!r.ok||!d.success) throw new Error(d?.error?.message||'ورود ناموفق بود.');
  location.replace('/index.html');
 }catch(err){msg.textContent=err.message;msg.style.display='block'}
 finally{btn.disabled=false;btn.textContent='ورود به سیستم'}
});
</script>
</body>
</html>
