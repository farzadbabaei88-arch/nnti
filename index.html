<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ninito | سیستم یکپارچه مدیریت</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            text-align: center;
        }

        .logo {
            font-size: 52px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #6b7280;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .card {
            margin-top: 50px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .feature {
            padding: 25px;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
        }

        .feature h3 {
            margin-bottom: 10px;
            color: #2563eb;
        }

        .feature p {
            font-size: 14px;
            margin-bottom: 0;
        }

        @media (max-width: 700px) {
            .logo {
                font-size: 40px;
            }

            h1 {
                font-size: 27px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            Ninito
        </div>

        <h1>
            سیستم یکپارچه مدیریت کسب‌وکار
        </h1>

        <p>
            مدیریت انبار، حسابداری، فروش و سفارشات
            در یک سیستم یکپارچه و قدرتمند.
        </p>

        <a href="#" class="btn">
            شروع کار
        </a>

        <section class="card">

            <h2>
                امکانات Ninito
            </h2>

            <div class="features">

                <div class="feature">
                    <h3>📦 انبارداری</h3>
                    <p>
                        مدیریت کالاها، موجودی، ورود و خروج کالا
                    </p>
                </div>

                <div class="feature">
                    <h3>💰 حسابداری</h3>
                    <p>
                        مدیریت تراکنش‌ها، درآمدها و هزینه‌ها
                    </p>
                </div>

                <div class="feature">
                    <h3>🛒 فروش</h3>
                    <p>
                        مدیریت محصولات، سفارشات و مشتریان
                    </p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
